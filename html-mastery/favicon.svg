<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  <!-- Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Left Bracket < -->
  <path d="M 22 22 L 12 32 L 22 42" fill="none" stroke="url(#codeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 42 22 L 52 32 L 42 42" fill="none" stroke="url(#codeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Slash / -->
  <line x1="36" y1="18" x2="28" y2="46" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" />
</svg>
