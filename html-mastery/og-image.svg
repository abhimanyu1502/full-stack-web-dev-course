<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="indigoGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="880" y1="0" x2="880" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="230" x2="1200" y2="230" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="490" x2="1200" y2="490" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect width="320" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="38" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">INTERACTIVE CURRICULUM</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">HTML &amp; CSS Mastery</text>

    <!-- Subtitle / Hook -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      Master modern web development with 96+ lessons,
    </text>
    <text x="0" y="198" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      live code playgrounds, and interactive challenges.
    </text>

    <!-- Feature Grid Badges -->
    <g transform="translate(0, 245)">
      <!-- Badge 1 -->
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-size="16">⚡</text>
      <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">47 HTML Topics</text>

      <!-- Badge 2 -->
      <rect x="195" y="0" width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="211" y="26" fill="#818cf8" font-family="monospace" font-size="16">🎨</text>
      <text x="235" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">49 CSS Lessons</text>

      <!-- Badge 3 -->
      <rect x="390" y="0" width="190" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="406" y="26" fill="#34d399" font-family="monospace" font-size="16">💻</text>
      <text x="430" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Live Code Sandbox</text>
    </g>

    <!-- Bottom URL Pill -->
    <g transform="translate(0, 395)">
      <rect width="360" height="48" rx="12" fill="url(#accentGrad)" filter="url(#shadow)" />
      <text x="24" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">🌐 webmastery-v1.vercel.app</text>
    </g>
  </g>

  <!-- Right Visual: Futuristic Code Card -->
  <g transform="translate(710, 85)" filter="url(#shadow)">
    <!-- Card Body -->
    <rect width="410" height="450" rx="18" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Window Controls Header -->
    <rect width="410" height="44" rx="18" fill="#1e293b" />
    <circle cx="28" cy="22" r="6" fill="#ef4444" />
    <circle cx="48" cy="22" r="6" fill="#f59e0b" />
    <circle cx="68" cy="22" r="6" fill="#10b981" />
    <text x="145" y="27" fill="#94a3b8" font-family="monospace" font-size="13">index.html — HTML Mastery</text>

    <!-- Code Content -->
    <g transform="translate(26, 75)" font-family="'Fira Code', monospace" font-size="14" xml:space="preserve">
      <text y="0" fill="#64748b">&lt;!DOCTYPE html&gt;</text>
      <text y="28" fill="#f43f5e">&lt;html <tspan fill="#38bdf8">lang</tspan>=<tspan fill="#a5f3fc">"en"</tspan>&gt;</text>
      <text y="56" fill="#64748b">  &lt;head&gt;</text>
      <text y="84" fill="#38bdf8">    &lt;title&gt;<tspan fill="#f8fafc">HTML Mastery</tspan>&lt;/title&gt;</text>
      <text y="112" fill="#64748b">  &lt;/head&gt;</text>
      <text y="140" fill="#f43f5e">  &lt;body&gt;</text>
      <text y="168" fill="#38bdf8">    &lt;h1&gt;<tspan fill="#f8fafc">Master Frontend</tspan>&lt;/h1&gt;</text>
      <text y="196" fill="#a855f7">    &lt;sandbox <tspan fill="#38bdf8">interactive</tspan>=<tspan fill="#a5f3fc">"true"</tspan>&gt;</text>
      <text y="224" fill="#10b981">      &lt;!-- Real-Time Coding --&gt;</text>
      <text y="252" fill="#a855f7">    &lt;/sandbox&gt;</text>
      <text y="280" fill="#f43f5e">  &lt;/body&gt;</text>
      <text y="308" fill="#f43f5e">&lt;/html&gt;</text>
    </g>

    <!-- Output Mini Pill Inside Card -->
    <g transform="translate(24, 390)">
      <rect width="362" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#10b981" />
      <text x="36" y="26" fill="#38bdf8" font-family="monospace" font-size="12">STATUS: 142/142 Tests Passed</text>
      <text x="290" y="26" fill="#a5b4fc" font-family="monospace" font-size="12">⚡ 100/100 SEO</text>
    </g>
  </g>
</svg>
