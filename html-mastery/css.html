<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mastery — Beginner to Practical</title>
    <meta name="description" content="Learn CSS from absolute beginner level to practical frontend web development.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Progress Indicator -->
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <!-- script.js will inject the course switcher here -->
            </div>

            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search HTML & CSS topics..." aria-label="Search documentation">
                <div id="search-results" class="search-results hidden"></div>
            </div>

            <div class="header-actions">
                <button type="button" id="theme-toggle" class="icon-button" aria-label="Toggle dark/light theme">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button type="button" id="mobile-menu-toggle" class="icon-button mobile-only" aria-label="Toggle menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="layout-container">
        <!-- CSS Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <nav id="table-of-contents" aria-label="Table of contents">
                <ul id="css-toc-list">
                    <!-- css-app.js will generate this list based on cssLessons array -->
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area where SPA routing happens -->
        <main class="content-area" id="main-content">
            <!-- Loading skeleton or initial landing state -->
            <div id="lesson-container">
                <p class="loading-state">Loading CSS Lesson...</p>
            </div>
        </main>
    </div>

    <!-- Base UI scripts (Theme, mobile menu, course switcher) -->
    <script src="quiz-engine.js?v=1"></script>
    <script src="quiz-data.js?v=1"></script>
    <script src="progress.js?v=1"></script>
    <script src="script.js?v=3"></script>
    <script src="editor.js?v=4"></script>
    <script src="hints.js?v=4"></script>
    <script src="exercise.js?v=5"></script>

    <!-- CSS Course Data -->
    <script src="css-data-1.js"></script>
    <script src="css-data-2.js"></script>
    <script src="css-data-3.js"></script>
    <script src="css-data-4.js"></script>

    <!-- CSS SPA Engine -->
    <script src="playgrounds.js?v=1"></script>
    <script src="css-app.js"></script>
    <script src="ai-assistant.js?v=1"></script>
    <script src="ai-ui.js?v=1"></script>
</body>
</html>
