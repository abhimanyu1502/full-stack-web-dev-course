<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Stack Web Development Mastery</title>
    <meta http-equiv="refresh" content="0; url=./html-mastery/dashboard.html">
    <link rel="canonical" href="./html-mastery/dashboard.html">
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --primary: #6366f1;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .redirect-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        a.btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        a.btn:hover {
            opacity: 0.9;
        }
    </style>
    <script>
        window.location.replace("./html-mastery/dashboard.html");
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h1>HTML & CSS Mastery Platform</h1>
        <p>Redirecting to your interactive learning dashboard...</p>
        <a class="btn" href="./html-mastery/dashboard.html">Click here if not redirected</a>
    </div>
</body>
</html>
